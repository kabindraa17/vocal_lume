name: vocal_lume
description: "VocaLume — a Flutter podcast player powered by the Podcast Index API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.9.2
  crypto: ^3.0.6
  dio_smart_retry: ^6.0.0

  # State
  flutter_riverpod: ^3.1.0

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Navigation
  go_router: ^13.2.0

  # Database
  drift: ^2.12.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28

  # UI
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  drift_dev: ^2.12.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
